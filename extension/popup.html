<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --line: #262b36;
        --ink: #e7e3da;
        --sub: #9a958c;
        --faint: #6b6860;
        --accent: #dc9a58;
        --good: #1fb872;
        --bad: #e2626b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 -apple-system, system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      header b { font-size: 13px; letter-spacing: 0.02em; }
      header .site { color: var(--faint); font-size: 11px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .primary { background: var(--accent); color: #0f1115; }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .ghost { background: transparent; color: var(--sub); border: 1px solid var(--line); }
      .status { font-size: 12px; color: var(--sub); min-height: 16px; }
      .status.err { color: var(--bad); }
      .status.ok { color: var(--good); }
      .note {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 12px;
        color: var(--sub);
        white-space: pre-wrap;
        display: none;
      }
      .save { border-top: 1px solid var(--line); padding-top: 12px; display: none; flex-direction: column; gap: 8px; }
      .save label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
      input.f {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        padding: 7px 9px;
        font-size: 13px;
      }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      a { color: var(--accent); text-decoration: none; }
      .setup { padding: 18px 14px; text-align: center; color: var(--sub); }
      .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.7s linear infinite; vertical-align: -1px; margin-right: 6px; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <b>HQ Autofill</b>
      <span class="site" id="site"></span>
    </header>

    <div id="setup" class="setup" style="display: none">
      Set your HQ token first.<br /><br />
      <button class="ghost" id="openOptions">Open settings</button>
    </div>

    <div id="main" class="body" style="display: none">
      <button class="primary" id="autoapply">Auto-apply on LinkedIn</button>
      <button class="ghost" id="fill">Fill this page (single form)</button>
      <div class="status" id="status"></div>
      <div class="note" id="note"></div>

      <div class="save" id="save">
        <div class="row">
          <div>
            <label>Company</label>
            <input class="f" id="company" placeholder="Company" />
          </div>
          <div>
            <label>Role</label>
            <input class="f" id="role" placeholder="Role" />
          </div>
        </div>
        <button class="primary" id="apply">Save to Applied</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
